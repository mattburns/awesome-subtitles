<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>awesome-subtitles</title>
    <meta
      name="description"
      content="Generate, edit, and burn subtitles entirely in your browser — your video never leaves your machine."
    />
    <!--
      We run single-threaded (no SharedArrayBuffer), so no COOP/COEP service
      worker is needed. This one-time cleanup unregisters any stale
      coi-serviceworker left over from an earlier deploy, which would otherwise
      keep intercepting (and failing) fetches.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then((regs) => regs.forEach((r) => r.unregister()))
          .catch(() => {})
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
